<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Co-Intelligence Readiness Framework</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
  }

  body {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: #111;
    padding: 4rem 1.5rem;
  }

  .faq-wrap {
    max-width: 720px;
    margin: 0 auto;
    background: transparent;
  }

  .faq-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .faq-title {
    font-size: 22px;
    font-weight: 500;
    color: #111;
    text-align: center;
  }

  .expand-btn {
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    background: transparent;
    border: 1px solid #ddd;
    color: #555;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .expand-btn:hover {
    background: rgba(0,0,0,0.04);
  }

  .faq-item {
    border-top: 1px solid #ddd;
  }

  .faq-item:last-child {
    border-bottom: 1px solid #ddd;
  }

  .faq-q {
    width: 100%;
    background: transparent;
    border: none;
    text-align: center;
    padding: 1.1rem 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    cursor: pointer;
    color: #111;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .faq-q:hover {
    color: #444;
  }

  .faq-q span {
    flex: 1;
    text-align: center;
  }

  .faq-chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    color: #999;
    transition: transform 0.2s ease;
  }

  .faq-q[aria-expanded="true"] .faq-chevron {
    transform: rotate(180deg);
  }

  .faq-a {
    display: none;
    padding: 0 0 1.1rem 0;
    font-size: 15px;
    color: #555;
    line-height: 1.75;
    text-align: center;
  }

  .faq-a a {
    color: #111;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .faq-a a:hover {
    color: #444;
  }

  .faq-item.open .faq-a {
    display: block;
  }

  @media (max-width: 600px) {
    body { padding: 2.5rem 1rem; }
    .faq-title { font-size: 18px; }
    .faq-q { font-size: 14px; }
    .faq-a { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="faq-wrap">
  <div class="faq-header">
    <h2 class="faq-title">Frequently asked questions</h2>
    <button class="expand-btn" id="faq-expand-btn" onclick="faqToggleAll()">Expand all</button>
  </div>
  <div id="faq-list"></div>
</div>

<script>
var faqData = [
  {
    q: "How is co-intelligence different from AI literacy or prompt engineering?",
    a: "Literacy and prompting are about operating the tool well. Co-intelligence is about what you carry into the work \u2014 judgment, conscience, lived context \u2014 that no model can supply. The skill layer matters. It is not sufficient."
  },
  {
    q: "Why should I assess myself on Co-Intelligence Readiness?",
    a: "Because the gap between using AI and using AI well is invisible until it isn\u2019t. The assessment tells you where you are deferring when you should be steering \u2014 and whether AI is making you more yourself, or turning you into a proxy for whatever a model produces by default."
  },
  {
    q: "Who is this for?",
    a: "Anyone who uses AI to do meaningful work \u2014 teachers, organizers, social workers, analysts, leaders, researchers. It is designed for people whose authority comes from lived experience, proximity to consequences, and domain experience and expertise."
  },
  {
    q: "Is this assessment private?",
    a: "Yes. The assessment runs entirely inside your own AI model. No data is submitted to an external platform, no account is created, and no results are stored anywhere outside your conversation. What If Love never sees your report. You are also welcome to read the prompt yourself before running it."
  },
  {
    q: "Will my results change depending on which AI model I use?",
    a: "The assessment is designed to evaluate your collaborative practice, not the personality or style of a specific AI model. In testing, users who engaged differently with different systems (ChatGPT, Claude) still produced remarkably similar readiness profiles across platforms."
  },
  {
    q: "What is the Co-Intelligence Readiness Framework?",
    a: "A rigorous behavioral framework that defines what effective human-AI collaboration looks like across five domains: benevolent intent, planning and scope, judgment and steering, follow-through and impact, and knowledge and growth. It measures what you do in collaboration, not what tools you use or what you say you value."
  },
  {
    q: "Why does the Co-Intelligence Readiness Framework exist?",
    a: "CIRF emerged from research identifying <a href=\"https://whatiflove.org/why-the-co-intelligence-readiness-framework-exists/\">20 critical skill gaps</a> AI notices in how humans collaborate with it \u2014 specifically, 12 timeless skills that will remain essential regardless of how AI develops, from LLM to agents to humanoids and beyond. The Co-Intelligence Readiness Framework was refined to target the assessment and development of these skills."
  }
];

var faqAllOpen = false;

function faqBuild() {
  var html = '';
  for (var i = 0; i < faqData.length; i++) {
    html += '<div class="faq-item" id="faq-item-' + i + '">'
      + '<button class="faq-q" aria-expanded="false" onclick="faqToggle(' + i + ')">'
      + '<span>' + faqData[i].q + '</span>'
      + '<svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>'
      + '</button>'
      + '<div class="faq-a">' + faqData[i].a + '</div>'
      + '</div>';
  }
  document.getElementById('faq-list').innerHTML = html;
}

function faqToggle(i) {
  var item = document.getElementById('faq-item-' + i);
  var btn = item.querySelector('.faq-q');
  var open = item.classList.contains('open');
  item.classList.toggle('open', !open);
  btn.setAttribute('aria-expanded', String(!open));
  faqSyncBtn();
}

function faqToggleAll() {
  faqAllOpen = !faqAllOpen;
  for (var i = 0; i < faqData.length; i++) {
    var item = document.getElementById('faq-item-' + i);
    var btn = item.querySelector('.faq-q');
    item.classList.toggle('open', faqAllOpen);
    btn.setAttribute('aria-expanded', String(faqAllOpen));
  }
  document.getElementById('faq-expand-btn').textContent = faqAllOpen ? 'Collapse all' : 'Expand all';
}

function faqSyncBtn() {
  var all = true;
  for (var i = 0; i < faqData.length; i++) {
    if (!document.getElementById('faq-item-' + i).classList.contains('open')) { all = false; break; }
  }
  faqAllOpen = all;
  document.getElementById('faq-expand-btn').textContent = all ? 'Collapse all' : 'Expand all';
}

faqBuild();

function faqPostHeight() {
  var h = document.body.scrollHeight;
  window.parent.postMessage({ faqHeight: h }, '*');
}

var faqObserver = new MutationObserver(faqPostHeight);
faqObserver.observe(document.getElementById('faq-list'), { subtree: true, attributes: true, attributeFilter: ['class'] });
window.addEventListener('load', faqPostHeight);
</script>
</body>
</html>
