<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Co-Intelligence Readiness Framework</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: #111;
    background: #fff;
    padding: 4rem 1.5rem;
  }

  .faq-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .faq-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .faq-title {
    font-size: 22px;
    font-weight: 500;
    color: #111;
  }

  .expand-btn {
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    background: none;
    border: 1px solid #ddd;
    color: #555;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .expand-btn:hover {
    background: #f5f5f5;
  }

  .faq-item {
    border-top: 1px solid #eee;
  }

  .faq-item:last-child {
    border-bottom: 1px solid #eee;
  }

  .faq-q {
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 1.1rem 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    cursor: pointer;
    color: #111;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .faq-q:hover {
    color: #444;
  }

  .faq-chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    color: #999;
    transition: transform 0.2s ease;
  }

  .faq-q[aria-expanded="true"] .faq-chevron {
    transform: rotate(180deg);
  }

  .faq-a {
    display: none;
    padding: 0 0 1.1rem 0;
    font-size: 15px;
    color: #555;
    line-height: 1.75;
  }

  .faq-a a {
    color: #111;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .faq-a a:hover {
    color: #444;
  }

  .faq-item.open .faq-a {
    display: block;
  }

  @media (max-width: 600px) {
    body { padding: 2.5rem 1rem; }
    .faq-title { font-size: 18px; }
    .faq-q { font-size: 14px; }
    .faq-a { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="faq-wrap">
  <div class="faq-header">
    <h2 class="faq-title">Frequently asked questions</h2>
    <button class="expand-btn" id="faq-expand-btn" onclick="faqToggleAll()">Expand all</button>
  </div>
  <div id="faq-list"></div>
</div>

<script>
var faqData = [
  {
    q: "How is co-intelligence different from AI literacy or prompt engineering?",
    a: "Literacy and prompting are about operating the tool well. Co-intelligence is about what you carry into the work — judgment, conscience, lived context — that no model can supply. The skill layer matters. It is not sufficient."
  },
  {
    q: "What is the Co-Intelligence Readiness Framework?",
    a: "A rigorous behavioral framework that defines what effective human-AI collaboration looks like across five domains: benevolent intent, planning and scope, judgment and steering, follow-through and impact, and knowledge and growth. It measures what you do in collaboration, not what tools you use or what you say you value."
  },
  {
    q: "What does the assessment actually measure?",
    a: "Your conversation history, reviewed by your own AI model, scored across all five CIRF domains. The output is a Portrait of your practice, domain ratings on the IDEH scale, and targeted next steps. Nothing leaves your model."
  },
  {
    q: "How do I get started?",
    a: "Take the assessment. It\u2019s a prompt: copy it, paste it into a new conversation with Claude or ChatGPT, and your AI generates the report in about 30 seconds. No account, no signup, nothing to install."
  },
  {
    q: "Why does the Co-Intelligence Readiness Framework exist?",
    a: "CIRF emerged from research identifying <a href=\"https://whatiflove.org/why-the-co-intelligence-readiness-framework-exists/\">20 critical skill gaps</a> AI notices in how humans collaborate with it \u2014 specifically, 12 timeless skills that will remain essential regardless of how AI develops, from LLM to agents to humanoids and beyond. The Co-Intelligence Readiness Framework was refined to target the assessment and development of these skills."
  },
  {
    q: "What is the IDEH scale?",
    a: "IDEH \u2014 Introductory, Developing, Effective, Highly Effective \u2014 describes your practice across each CIRF domain. The outer bands are narrow: most practitioners land in Developing or Effective, where the difference is whether best practices are still being applied consciously or have been fully internalized. Highly Effective practitioners are distinguished not by personal mastery alone, but by a practice visible and strong enough that others grow because of it."
  },
  {
    q: "Who is this for?",
    a: "Anyone who uses AI to do meaningful work \u2014 teachers, organizers, social workers, analysts, leaders, researchers. The framework is not designed for developers or AI specialists. It is designed for people whose authority comes from proximity to consequences, not technical credentials."
  },
  {
    q: "Is this assessment private?",
    a: "Yes. The assessment runs entirely inside your own AI model. No data is submitted to an external platform, no account is created, and no results are stored anywhere outside your conversation. What If Love never sees your report."
  },
  {
    q: "What is \u2018benevolent intent\u2019 and why is it a domain?",
    a: "Benevolent intent is the domain that asks whether the purpose driving your AI collaboration is oriented toward the wellbeing of others \u2014 not just efficiency or output. It is the first domain because it shapes everything that follows. An AI system directed by conscience produces different work than one directed purely by productivity."
  },
  {
    q: "How is co-intelligence relevant as AI becomes more capable?",
    a: "As models improve, the technical skill gap narrows. What does not change is the need for human moral judgment, contextual authority, and accountability for outcomes. Co-intelligence is the framework for what remains distinctly human \u2014 not despite better AI, but because of it."
  }
];

var faqAllOpen = false;

function faqBuild() {
  var html = '';
  for (var i = 0; i < faqData.length; i++) {
    html += '<div class="faq-item" id="faq-item-' + i + '">'
      + '<button class="faq-q" aria-expanded="false" onclick="faqToggle(' + i + ')">'
      + '<span>' + faqData[i].q + '</span>'
      + '<svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>'
      + '</button>'
      + '<div class="faq-a">' + faqData[i].a + '</div>'
      + '</div>';
  }
  document.getElementById('faq-list').innerHTML = html;
}

function faqToggle(i) {
  var item = document.getElementById('faq-item-' + i);
  var btn = item.querySelector('.faq-q');
  var open = item.classList.contains('open');
  item.classList.toggle('open', !open);
  btn.setAttribute('aria-expanded', String(!open));
  faqSyncBtn();
}

function faqToggleAll() {
  faqAllOpen = !faqAllOpen;
  for (var i = 0; i < faqData.length; i++) {
    var item = document.getElementById('faq-item-' + i);
    var btn = item.querySelector('.faq-q');
    item.classList.toggle('open', faqAllOpen);
    btn.setAttribute('aria-expanded', String(faqAllOpen));
  }
  document.getElementById('faq-expand-btn').textContent = faqAllOpen ? 'Collapse all' : 'Expand all';
}

function faqSyncBtn() {
  var all = true;
  for (var i = 0; i < faqData.length; i++) {
    if (!document.getElementById('faq-item-' + i).classList.contains('open')) { all = false; break; }
  }
  faqAllOpen = all;
  document.getElementById('faq-expand-btn').textContent = all ? 'Collapse all' : 'Expand all';
}

faqBuild();
</script>
</body>
</html>
