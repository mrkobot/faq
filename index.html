<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Co-Intelligence Readiness Framework</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
  }

  body {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: #111;
    padding: 4rem 1.5rem;
  }

  .faq-wrap {
    max-width: 720px;
    margin: 0 auto;
    background: transparent;
  }

  .faq-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .faq-title {
    font-size: 22px;
    font-weight: 500;
    color: #111;
    text-align: center;
  }

  .expand-btn {
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    background: transparent;
    border: 1px solid #ddd;
    color: #555;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .expand-btn:hover {
    background: rgba(0,0,0,0.04);
  }

  .faq-item {
    border-top: 1px solid #ddd;
  }

  .faq-item:last-child {
    border-bottom: 1px solid #ddd;
  }

  .faq-q {
    width: 100%;
    background: transparent;
    border: none;
    text-align: center;
    padding: 1.1rem 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    cursor: pointer;
    color: #111;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .faq-q:hover {
    color: #444;
  }

  .faq-q span {
    flex: 1;
    text-align: center;
  }

  .faq-chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    color: #999;
    transition: transform 0.2s ease;
  }

  .faq-q[aria-expanded="true"] .faq-chevron {
    transform: rotate(180deg);
  }

  .faq-a {
    display: none;
    padding: 0 0 1.1rem 0;
    font-size: 15px;
    color: #555;
    line-height: 1.75;
    text-align: center;
  }

  .faq-a a {
    color: #111;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .faq-a a:hover {
    color: #444;
  }

  .faq-item.open .faq-a {
    display: block;
  }

  @media (max-width: 600px) {
    body { padding: 2.5rem 1rem; }
    .faq-title { font-size: 18px; }
    .faq-q { font-size: 14px; }
    .faq-a { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="faq-wrap">
  <div class="faq-header">
    <h2 class="faq-title">Frequently asked questions</h2>
    <button class="expand-btn" id="faq-expand-btn" onclick="faqToggleAll()">Expand all</button>
  </div>
  <div id="faq-list"></div>
</div>

<script>
var faqData = [
  {
    q: "How is co-intelligence different from AI literacy or prompt engineering?",
    a: "Literacy tells you what the tool is. Prompting tells you how to use it. Neither asks what you bring, or what\u2019s at stake if you arrive or leave empty.<br><br>Co-intelligence begins there. It names what the human must supply\u2014judgment, lived experience, voice\u2014and protects what we leave with: greater capacity and the human agency that enables our moral conviction to steer AI."
  },
  {
    q: "Why does co-intelligence require assessment rather than just explanation?",
    a: "Because the gap between using AI and using AI well is invisible until it isn\u2019t. The assessment answers two questions: where you are deferring when you should be steering, and whether AI is making you more yourself or turning you into a proxy for whatever a model produces by default. CIRF gives that gap a structure: five domains, four levels, a clear picture of where you are and where deliberate growth is possible."
  },
  {
    q: "Who is this for?",
    a: "Anyone who uses AI to do meaningful work. Right now: people whose authority was earned through proximity to consequences\u2014teachers, analysts, social workers, researchers, leaders\u2014whose judgment, lived experience, and voice can direct AI toward work a non-domain expert cannot produce."
  },
  {
    q: "Is the assessment private?",
    a: "Yes. It runs inside your own AI model. No data leaves your conversation, no account is created, and What If Love never sees your results."
  },
  {
    q: "Will my results change depending on which AI model I use?",
    a: "Unlikely. The assessment evaluates your collaborative practice, not the model\u2019s personality. The human is the constant across platforms. In testing, readiness profiles held with unusual accuracy regardless of which AI you use."
  },
  {
    q: "What is What If Love?",
    a: "An AI research lab built on a single conviction: AI without care isn\u2019t really intelligence at all. What If Love directs the findings of mechanistic interpretability toward human good. We try to understand AI to make it kinder, not just smarter."
  },
  {
    q: "Why does the Co-Intelligence Readiness Framework exist?",
    a: "CIRF emerged from research identifying <a href=\"https://whatiflove.org/why-the-co-intelligence-readiness-framework-exists/\">20 critical skill gaps</a> in how humans collaborate with AI\u2014specifically, 12 timeless human capacities that will remain essential regardless of how AI develops. The framework was built to assess and develop those capacities. The research is available in the co-intelligence briefs."
  }
];

var faqAllOpen = false;

function faqBuild() {
  var html = '';
  for (var i = 0; i < faqData.length; i++) {
    html += '<div class="faq-item" id="faq-item-' + i + '">'
      + '<button class="faq-q" aria-expanded="false" onclick="faqToggle(' + i + ')">'
      + '<span>' + faqData[i].q + '</span>'
      + '<svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>'
      + '</button>'
      + '<div class="faq-a">' + faqData[i].a + '</div>'
      + '</div>';
  }
  document.getElementById('faq-list').innerHTML = html;
}

function faqToggle(i) {
  var item = document.getElementById('faq-item-' + i);
  var btn = item.querySelector('.faq-q');
  var open = item.classList.contains('open');
  item.classList.toggle('open', !open);
  btn.setAttribute('aria-expanded', String(!open));
  faqSyncBtn();
}

function faqToggleAll() {
  faqAllOpen = !faqAllOpen;
  for (var i = 0; i < faqData.length; i++) {
    var item = document.getElementById('faq-item-' + i);
    var btn = item.querySelector('.faq-q');
    item.classList.toggle('open', faqAllOpen);
    btn.setAttribute('aria-expanded', String(faqAllOpen));
  }
  document.getElementById('faq-expand-btn').textContent = faqAllOpen ? 'Collapse all' : 'Expand all';
}

function faqSyncBtn() {
  var all = true;
  for (var i = 0; i < faqData.length; i++) {
    if (!document.getElementById('faq-item-' + i).classList.contains('open')) { all = false; break; }
  }
  faqAllOpen = all;
  document.getElementById('faq-expand-btn').textContent = all ? 'Collapse all' : 'Expand all';
}

faqBuild();

function faqPostHeight() {
  var h = document.body.scrollHeight;
  window.parent.postMessage({ faqHeight: h }, '*');
}

window.addEventListener('load', function() { setTimeout(faqPostHeight, 200); });
window.addEventListener('resize', function() { setTimeout(faqPostHeight, 100); });

var faqObserver = new MutationObserver(function() { setTimeout(faqPostHeight, 100); });
faqObserver.observe(document.getElementById('faq-list'), { subtree: true, attributes: true, attributeFilter: ['class'] });

if (window.ResizeObserver) {
  new ResizeObserver(function() { setTimeout(faqPostHeight, 100); }).observe(document.body);
}
</script>
</body>
</html>
